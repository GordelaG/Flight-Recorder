name: Build & Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # Runs every 5 days at 00:00 UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get Current Date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Run HubHop Sync Tool (Scheduled / Dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Running HubHop Profile Synchronization..."
          dotnet run --project tools/FlightRecorder.ProfileSync/FlightRecorder.ProfileSync.csproj -- --output "FlightRecorder.Client/aircraft_profiles"

      - name: Check for Updated Profiles
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: git_status
        shell: pwsh
        run: |
          $changes = git status --porcelain FlightRecorder.Client/aircraft_profiles
          if ($changes) {
            Write-Host "Changes detected in aircraft profiles:"
            Write-Host $changes
            "has_changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No changes detected. Aircraft profiles are already up-to-date."
            "has_changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Commit & Push Updated Profiles
        if: steps.git_status.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add FlightRecorder.Client/aircraft_profiles
          git commit -m "chore(profiles): auto-sync aircraft profiles from HubHop API [skip ci]"
          git push

      - name: Run Automated Tests
        shell: pwsh
        run: |
          Write-Host "Executing unit tests suite..."
          dotnet test --configuration Release

      - name: Build Application Bundle & Installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.git_status.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $buildVer = "0.27.${{ github.run_number }}"
          Write-Host "Publishing Flight Recorder (win-x64) version $buildVer..."
          dotnet publish FlightRecorder.Client/FlightRecorder.Client.csproj -c Release -r win-x64 --self-contained false -o publish /p:Version="$buildVer" /p:FileVersion="$buildVer.0" /p:AssemblyVersion="$buildVer.0"

          "$buildVer" | Out-File -FilePath "publish/version.txt" -Encoding utf8 -NoNewline

          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
          }

          Write-Host "Compiling Inno Setup Installer (FlightRecorder-Setup.exe)..."
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $isccPath) {
            throw "iscc.exe was not found after installing innosetup!"
          }

          & $isccPath /DMyAppVersion="0.27.${{ github.run_number }}" installer.iss

          if (-not (Test-Path "installer_output/FlightRecorder-Setup.exe")) {
            throw "FlightRecorder-Setup.exe was not created in installer_output!"
          }
          Write-Host "Installer created successfully: installer_output/FlightRecorder-Setup.exe"

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.git_status.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'schedule' && format('profiles-{0}', steps.date.outputs.date) || format('v0.27.{0}', github.run_number)) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Flight Recorder {0}', github.ref_name) || (github.event_name == 'schedule' && format('Flight Recorder - Aircraft Profiles Sync ({0})', steps.date.outputs.date) || format('Flight Recorder v0.27.{0}', github.run_number)) }}
          body: |
            ### ✈️ Flight Recorder Release
            Instalador oficial do Flight Recorder para Windows (64-bit).
            
            - **Instalação Personalizada:** Escolha o diretório de instalação e opção de ícone na Área de Trabalho.
            - **Atualização Automática:** Atualiza automaticamente ao iniciar se houver novas versões no GitHub.
            - **SimConnect Nativo:** 100% nativo (zero arquivos WASM na pasta Community).
            - **Perfis de Aeronaves:** 137+ perfis pré-instalados (MobiFlight HubHop).
            
            #### 📥 Download Único:
            - **`FlightRecorder-Setup.exe`**: Baixe e execute o instalador.
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            installer_output/FlightRecorder-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
